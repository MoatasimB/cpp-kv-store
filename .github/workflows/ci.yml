name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake netcat-openbsd

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration test
        run: ./scripts/integration_test.sh

      - name: Docker build
        run: docker build -t cpp-kv-store .
